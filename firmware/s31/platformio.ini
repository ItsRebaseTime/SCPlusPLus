; PlatformIO project for the ESP32-S31 Function-CoreBoard-1 target — the
; only firmware target in this repo (the earlier Arduino/ESP32-S3 build has
; been removed). This is its own standalone PlatformIO project (separate
; `[platformio]` section with its own boards_dir/src_dir) rather than a
; repo-root platformio.ini, since PlatformIO's `src_dir`/`boards_dir`
; options are only settable globally, not per-environment — kept this way
; even after the S3 target's removal since it cleanly isolates this native
; ESP-IDF project from ever needing to share config with a future
; Arduino-framework target.
;
; Board definition is shared from the repo root's boards/ directory.
;
; KNOWN BROKEN as of 2026-08-13: `pio run -e s31coreboard` currently fails
; with "Error: Missing toolchain directory 'None'" even after correctly
; resolving and downloading the right GCC build (esp-15.2.0_20251204). This
; is a real bug in pioarduino/platform-espressif32 55.3.311's
; install_tool()/_install_with_idf_tools() glue: it installs the toolchain
; via ESP-IDF's own idf_tools.py into $IDF_TOOLS_PATH/tools/, then calls
; pm.install() to register it with PlatformIO's own package resolver, but
; that registration doesn't stick — a subsequent platform.get_package_dir()
; call returns None. Confirmed reproducible from a clean package cache.
;
; Until pioarduino fixes this, build via `idf.py` directly instead — see
; BUILD.md in this directory for the full, verified-working recipe (uses
; the same ESP-IDF master checkout and GCC 15.2.0 build referenced below,
; just invoked without PlatformIO's build glue).

[platformio]
boards_dir = ../../boards
src_dir = main

[env:s31coreboard]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.311/platform-espressif32.zip
board = esp32s31_coreboard1
framework = espidf
platform_packages =
    pioarduino/framework-espidf @ https://github.com/pioarduino/esp-idf.git#master
    toolchain-riscv32-esp @ file:///home/itsrebasetime/.espressif/toolchain/riscv32-esp-elf

monitor_speed = 115200
